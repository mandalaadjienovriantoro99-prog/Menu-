<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pesan dari meja</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=DM+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
[hidden]{display:none!important}
:root{--bg:#f5f4f1;--card:#fff;--ink:#1c1715;--mut:#756c66;--red:#d92b17;--yel:#ffc62e;--line:#e6e2dc;color-scheme:light dark}
@media(prefers-color-scheme:dark){:root{--bg:#141110;--card:#1f1b19;--ink:#f4efea;--mut:#a0958d;--red:#e5402b;--line:#332e2b}}
body{font:16px/1.45 "DM Sans",system-ui,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:110px}
h1,h2,.num,.tbl b{font-family:"Bricolage Grotesque","DM Sans",system-ui,sans-serif}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0}
:focus-visible{outline:3px solid var(--yel);outline-offset:2px}
header{background:var(--red);color:#fff;display:flex;justify-content:space-between;align-items:flex-end;gap:16px;padding:calc(env(safe-area-inset-top,0px) + 20px) 20px 20px}
header p{font-size:14px;opacity:.92}
h1{font-size:26px;line-height:1.1;font-weight:800}
.tbl{background:var(--yel);color:#1c1715;border-radius:14px;padding:6px 16px 8px;text-align:center;line-height:1}
.tbl span{font-size:13px;font-weight:600;display:block;margin-bottom:2px}
.tbl b{font-size:40px;font-weight:800}
#chips{position:sticky;top:0;z-index:5;display:flex;gap:8px;overflow-x:auto;padding:12px 20px;background:var(--bg)}
#chips button{flex:none;padding:10px 18px;border-radius:99px;background:var(--card);border:1px solid var(--line);font-weight:600;min-height:44px}
#chips button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
main{padding:4px 20px;max-width:640px;margin:0 auto}
.it,.row{display:flex;gap:14px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;margin:10px 0}
.em{flex:none;width:64px;height:64px;border-radius:12px;background:var(--bg);display:grid;place-items:center;font-size:34px}
.tx{flex:1;min-width:0}
.tx h2{font-size:17px;font-weight:700}
.tx p{font-size:14px;color:var(--mut)}
.pr{font-weight:700;margin-top:4px}
.add{padding:10px 16px;border-radius:99px;background:var(--red);color:#fff;font-weight:700;min-height:44px}
.st{display:flex;align-items:center;gap:6px}
.st button{width:40px;height:40px;border-radius:50%;background:var(--bg);border:1px solid var(--line);font-size:20px}
.st b{min-width:22px;text-align:center}
.sec{font-size:18px;margin:24px 0 6px}
.back{background:none;color:var(--mut);padding:12px 0;font-weight:600}
label{display:block;font-size:14px;font-weight:600;margin:12px 0 0}
label input:not([type=radio]){display:block;width:100%;margin-top:6px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-weight:400}
.pays{display:grid;gap:10px;margin-top:8px}
.pay{position:relative;display:flex;gap:12px;align-items:center;margin:0;padding:14px;border-radius:14px;border:2px solid var(--line);background:var(--card);cursor:pointer;font-weight:400;font-size:16px}
.pay.on{border-color:var(--red)}
.pay input{position:absolute;opacity:0}
.pay:focus-within{outline:3px solid var(--yel)}
.pay small{display:block;color:var(--mut);font-size:13px}
.ic{font-size:26px}
.tot{display:flex;justify-content:space-between;align-items:center;font-size:18px;margin:22px 0 4px}
.tot b{font-size:24px}
.cta{display:block;width:100%;text-align:center;text-decoration:none;padding:16px;border-radius:14px;background:var(--red);color:#fff;font-weight:700;font-size:17px;margin-top:12px}
.ghost{width:100%;padding:14px;margin-top:10px;background:none;border:1px solid var(--line);border-radius:14px;font-weight:600}
#bar{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);max-width:616px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 12px 12px 20px;border-radius:18px;background:var(--ink);color:var(--bg);box-shadow:0 8px 24px rgba(0,0,0,.25)}
#bar div{display:flex;flex-direction:column;line-height:1.25}
#bar button{background:var(--yel);color:#1c1715;font-weight:700;padding:12px 18px;border-radius:12px;min-height:44px}
.ok{text-align:center;padding:28px 0 8px}
.ok .num{font-size:72px;font-weight:800;color:var(--red);line-height:1;margin:6px 0}
.box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-top:14px}
.box h2{font-size:20px;margin-bottom:10px}
.qr{text-align:center;margin-bottom:10px}
.qr img{width:100%;max-width:340px;border-radius:12px;background:#fff}
.mut{color:var(--mut);font-size:14px}
#toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;z-index:9;font-weight:600}
</style>
</head>
<body>
<header>
  <div><p>Pesan dari meja</p><h1 id="nama"></h1></div>
  <div class="tbl"><span>Meja</span><b id="meja">–</b></div>
</header>

<main id="main"></main>
<div id="bar" hidden></div>

};
const MENU = [
  {id:1, c:"Mie", n:"Mie Pedas Level 1", d:"Mie ayam cincang, pedasnya masih ramah", p:15000, e:"🍜", l:1},
  {id:2, c:"Mie", n:"Mie Pedas Level 3", d:"Cabai rawit tiga kali lipat untuk yang berani", p:17000, e:"🍜", l:3},
  {id:3, c:"Mie", n:"Mie Keju Leleh", d:"Mie gurih dengan saus keju", p:18000, e:"🧀", l:0},
  {id:4, c:"Mie", n:"Mie Komplit", d:"Mie dengan ayam, bakso, dan telur", p:20000, e:"🍝", l:1},
  {id:5, c:"Dimsum", n:"Dimsum Udang Keju", d:"Isi 3, udang dan keju", p:12000, e:"🥟", l:0},
  {id:6, c:"Dimsum", n:"Lumpia Udang", d:"Isi 3, renyah dengan saus sambal", p:12000, e:"🥠", l:0},
  {id:7, c:"Dimsum", n:"Siomay Ayam", d:"Isi 3, kukus dengan sambal kacang", p:10000, e:"🥟", l:0},
  {id:8, c:"Minuman", n:"Es Teh Manis", d:"Teh dingin, manisnya pas", p:5000, e:"🧋", l:0},
  {id:9, c:"Minuman", n:"Es Jeruk", d:"Jeruk peras segar", p:8000, e:"🍊", l:0},
  {id:10, c:"Minuman", n:"Es Cokelat", d:"Cokelat susu dingin", p:10000, e:"🍫", l:0},
  {id:11, c:"Camilan", n:"Kentang Goreng", d:"Porsi besar dengan bumbu tabur", p:12000, e:"🍟", l:0},
  {id:12, c:"Camilan", n:"Tahu Crispy", d:"Tahu goreng tepung, cocok buat nyemil", p:9000, e:"🍢", l:0}
];
/* ====== SELESAI ====== */

const PAY = {
  qris:  {t:"QRIS", s:"Scan dengan e-wallet atau m-banking", i:"📱"},
  tunai: {t:"Tunai", s:"Bayar di kasir", i:"💵"},
  debit: {t:"Kartu debit", s:"Gesek kartu di kasir", i:"💳"}
};
const $ = s => document.querySelector(s);
const rp = n => "Rp" + n.toLocaleString("id-ID");
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const cats = [...new Set(MENU.map(m => m.c))];
const q = new URLSearchParams(location.search);
const S = {cat:cats[0], cart:{}, view:"menu", pay:"qris", nama:"", catatan:"", order:null, meja:(q.get("meja")||"").slice(0,4)};
const mejaUrl = !!S.meja;

const items = () => MENU.filter(m => S.cart[m.id]);
const count = () => Object.values(S.cart).reduce((a,b) => a+b, 0);
const total = () => items().reduce((a,m) => a + m.p*S.cart[m.id], 0);

function qty(id, d){
  S.cart[id] = Math.max(0, (S.cart[id]||0) + d);
  if(!S.cart[id]) delete S.cart[id];
  if(!count() && S.view === "cart") S.view = "menu";
  draw();
}
function go(v){ S.view = v; draw(); scrollTo(0,0); }
function toast(t){
  const e = $("#toast"); e.textContent = t; e.hidden = false;
  clearTimeout(toast.t); toast.t = setTimeout(() => e.hidden = true, 2200);
}
function reset(){ S.cart = {}; S.order = null; S.catatan = ""; go("menu"); }
function submit(){
  if(!S.nama.trim()) return toast("Isi nama dulu ya");
  if(!S.meja.trim()) return toast("Isi nomor meja dulu ya");
  S.order = {no: "A" + (100 + Math.floor(Math.random()*900))};
  go("done");
}
function wa(){
  const l = ["Pesanan " + S.order.no, "Nama: " + S.nama, "Meja: " + S.meja, "", ...items().map(m => S.cart[m.id] + "x " + m.n)];
  if(S.catatan.trim()) l.push("", "Catatan: " + S.catatan);
  l.push("", "Total: " + rp(total()), "Bayar: " + PAY[S.pay].t);
  return "https://wa.me/" + CONFIG.wa + "?text=" + encodeURIComponent(l.join("\n"));
}

const step = m => S.cart[m.id]
  ? `<div class="st"><button aria-label="Kurangi ${esc(m.n)}" onclick="qty(${m.id},-1)">−</button><b>${S.cart[m.id]}</b><button aria-label="Tambah ${esc(m.n)}" onclick="qty(${m.id},1)">+</button></div>`
  : `<button class="add" onclick="qty(${m.id},1)">Tambah</button>`;

const menuV = () => MENU.filter(m => m.c === S.cat).map(m => `
  <article class="it"><div class="em">${m.e}</div>
    <div class="tx"><h2>${m.n}</h2><p>${m.d}</p>
      <div class="pr">${rp(m.p)}${m.l ? ` <span title="Level pedas ${m.l}">${"🔥".repeat(m.l)}</span>` : ""}</div></div>
    ${step(m)}</article>`).join("");

const cartV = () => `
  <button class="back" onclick="go('menu')">‹ Kembali ke menu</button>
  <h2 class="sec">Pesananmu</h2>
  ${items().map(m => `<div class="row"><div class="tx"><h2>${m.n}</h2><p>${rp(m.p)}</p></div>${step(m)}</div>`).join("")}
  <h2 class="sec">Data pemesan</h2>
  <label>Nama<input value="${esc(S.nama)}" oninput="S.nama=this.value" placeholder="Nama kamu" autocomplete="name"></label>
  ${mejaUrl ? "" : `<label>Nomor meja<input value="${esc(S.meja)}" inputmode="numeric" oninput="S.meja=this.value;$('#meja').textContent=S.meja||'–'" placeholder="Contoh: 12"></label>`}
  <label>Catatan (boleh kosong)<input value="${esc(S.catatan)}" oninput="S.catatan=this.value" placeholder="Contoh: tanpa bawang"></label>
  <h2 class="sec">Cara bayar</h2>
  <div class="pays">${Object.entries(PAY).map(([k,v]) => `
    <label class="pay ${S.pay===k ? "on" : ""}"><input type="radio" name="pay" ${S.pay===k ? "checked" : ""} onchange="S.pay='${k}';draw()">
      <span class="ic">${v.i}</span><span><b>${v.t}</b><small>${v.s}</small></span></label>`).join("")}</div>
  <div class="tot"><span>Total</span><b>${rp(total())}</b></div>
  <button class="cta" onclick="submit()">Pesan sekarang</button>`;

const doneV = () => {
  const no = S.order.no;
  const how = S.pay === "qris"
    ? `<div class="qr"><img src="${CONFIG.qris}" alt="Kode QRIS" onerror="this.hidden=true;this.nextElementSibling.hidden=false"><p class="mut" hidden>Gambar QRIS gagal dimuat. Minta kasir untuk menunjukkan QRIS toko.</p></div><p>Scan kode di atas dan bayar sebesar ${rp(total())}. Tunjukkan bukti bayar ke kasir.</p>`
    : S.pay === "tunai"
    ? `<p>Bayar tunai di kasir dan sebutkan nomor pesanan <b>${no}</b>.</p>`
    : `<p>Bayar dengan kartu debit di kasir dan sebutkan nomor pesanan <b>${no}</b>.</p>`;
  return `<section class="ok"><p>Pesanan diterima. Nomor pesananmu:</p><div class="num">${no}</div>
    <p class="mut">Atas nama ${esc(S.nama)}, meja ${esc(S.meja)}</p></section>
    <div class="box"><h2>Total ${rp(total())}</h2>${how}</div>
    <a class="cta" href="${wa()}" target="_blank" rel="noopener">Kirim pesanan ke kasir lewat WhatsApp</a>
    <button class="ghost" onclick="reset()">Pesan lagi</button>`;
};

function draw(){
  const y = scrollY;
  $("#nama").textContent = CONFIG.nama;
  $("#meja").textContent = S.meja || "–";
  $("#chips").hidden = S.view !== "menu";
  $("#chips").innerHTML = cats.map(c => `<button class="${c===S.cat ? "on" : ""}" onclick="S.cat='${c}';draw()">${c}</button>`).join("");
  $("#main").innerHTML = S.view === "menu" ? menuV() : S.view === "cart" ? cartV() : doneV();
  const bar = $("#bar");
  bar.hidden = !(S.view === "menu" && count());
  bar.innerHTML = `<div><b>${count()} item</b><span>${rp(total())}</span></div><button onclick="go('cart')">Lihat pesanan</button>`;
  scrollTo(0, y);
}
draw();
</script>
</body>
</html>
